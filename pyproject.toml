[project]
name = "jobradar"
version = "0.1.0"
description = "Local aggregator for remote job postings with per-posting resume tailoring"
readme = "README.md"
authors = [
    { name = "Sebastian", email = "sebasarcose@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "html2text>=2025.4.15",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]

# domain/ holds the pure business rules, so every function there must be fully annotated.
[[tool.mypy.overrides]]
module = ["jobradar.domain.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
