name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no step here writes to the repository.
permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes. Runs on main are
# never cancelled, so every commit on main keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is the name of the status check that the ruleset on main
  # requires. Renaming it leaves every PR waiting for a check that never reports.
  backend:
    # Pinned instead of ubuntu-latest: the runner image changes only when we
    # decide to move it, not when GitHub migrates the label.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        # Same values as .env.example. A throwaway container, not a secret.
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: local
          POSTGRES_DB: jobradar
        ports:
          - 5432:5432
        # Passed to `docker create`. The job's steps start once this reports healthy.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Steps run on the runner itself, where the service is published on
      # localhost:5432 (in compose, the api container reaches it as db:5432).
      DATABASE_URL: postgresql+psycopg://jobradar:local@localhost:5432/jobradar

    steps:
      # Actions are pinned to a commit SHA: a tag can be moved to other code, a SHA cannot.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv picks Python 3.12 from .python-version, so there is no setup-python step.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv as the Dockerfile (and local). Bump both together.
          version: "0.11.13"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml, like the Docker build.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No paths on purpose: paths on the command line replace `files` in
      # pyproject.toml, so CI and local runs would stop checking the same thing.
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest
